<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ── tokens ─────────────────────────────────────────────────────────────
   Black theme. Green = cheap/available, amber = DC fast, dim = busy.
   Nothing else is coloured — colour has to mean something.               */
const C = {
  bg:      '#0B0D0F',
  surface: '#14181C',
  raised:  '#1B2026',
  line:    'rgba(255,255,255,.09)',
  line2:   'rgba(255,255,255,.16)',
  text:    '#F2F4F3',
  mid:     'rgba(242,244,243,.62)',
  dim:     'rgba(242,244,243,.38)',
  green:   '#00D68F',
  greenDim:'rgba(0,214,143,.14)',
  amber:   '#FF9B4D',
  amberDim:'rgba(255,155,77,.14)',
  ink:     '#06120D',
};
const MONO = "'JetBrains Mono',ui-monospace,monospace";
const SANS = "Archivo,'Helvetica Neue',Helvetica,sans-serif";

/* ── data ────────────────────────────────────────────────────────────── */
const STATIONS = [
  { id:'orchard',  name:'DHA Phase 5 · Y Block',      area:'Residential · Type 2', price:48,  kw:7,   free:1, guns:2, score:7.6, dist:2.2, dc:false, lat:31.4697, lon:74.4092, x:'22%', y:'30%' },
  { id:'lakeside', name:'Emporium Mall P2',           area:'Basement car park',    price:65,  kw:22,  free:4, guns:6, score:8.8, dist:1.1, dc:false, lat:31.4697, lon:74.2646, x:'58%', y:'22%' },
  { id:'meridian', name:'Gulberg Main Boulevard',     area:'Forecourt · CCS2',     price:95,  kw:60,  free:2, guns:3, score:9.4, dist:0.4, dc:true,  lat:31.5204, lon:74.3439, x:'40%', y:'46%' },
  { id:'garage',   name:'Liberty Market Garage',      area:'Underground · CCS2',   price:110, kw:50,  free:0, guns:2, score:6.2, dist:0.9, dc:true,  lat:31.5100, lon:74.3436, x:'74%', y:'52%' },
  { id:'northgate',name:'M-2 Kot Momin Service Area', area:'Motorway plaza',       price:135, kw:150, free:1, guns:4, score:9.1, dist:3.6, dc:true,  lat:32.1833, lon:72.8833, x:'16%', y:'62%' },
];

const CAP = 64;          // kWh usable battery — BYD Atto 3
const EFF = 6.2;         // km per kWh
const PETROL_DEFAULT = 325.43;
const PETROL_DATE = 'OGRA · 14 Aug 2026';
const KMPL_DEFAULT = 12;

/* ── helpers ─────────────────────────────────────────────────────────── */
const money = (n) => 'Rs ' + Math.round(n).toLocaleString('en-US');
const rs    = (n) => 'Rs ' + n.toFixed(1);
const mins  = (h) => { const t = Math.round(h * 60);
  return t >= 60 ? Math.floor(t/60) + 'h ' + String(t%60).padStart(2,'0') + 'm' : t + ' min'; };

// Straight-line distance. Not driving distance — labelled as such in the UI.
function haversine(aLat, aLon, bLat, bLon) {
  const R = 6371, t = (x) => x * Math.PI / 180;
  const dLat = t(bLat - aLat), dLon = t(bLon - aLon);
  const h = Math.sin(dLat/2)**2 + Math.cos(t(aLat)) * Math.cos(t(bLat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Persistence that degrades to memory if storage is unavailable (private mode,
// sandboxed frame). Never throws.
const mem = {};
const store = {
  get(k, fb) {
    try { const v = localStorage.getItem('carev:' + k); return v == null ? fb : JSON.parse(v); }
    catch (e) { return k in mem ? mem[k] : fb; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem('carev:' + k, JSON.stringify(v)); } catch (e) {}
  },
};

/* ── primitives ──────────────────────────────────────────────────────── */
function Eyebrow({ children, style }) {
  return <div style={{ font: `500 10px/1 ${MONO}`, letterSpacing: '.18em',
    color: C.dim, textTransform: 'uppercase', ...style }}>{children}</div>;
}

function Chip({ label, on, tone, onClick }) {
  const accent = tone === 'amber' ? C.amber : C.green;
  return (
    <button onClick={onClick} style={{
      height: 34, padding: '0 13px', borderRadius: 11, cursor: 'pointer',
      font: `500 12.5px/1 ${SANS}`, whiteSpace: 'nowrap',
      background: on ? accent : 'rgba(255,255,255,.05)',
      color: on ? C.ink : C.text,
      border: `1px solid ${on ? accent : C.line}`,
      transition: 'background .16s, color .16s',
    }}>{label}</button>
  );
}

function Stat({ label, value, tone }) {
  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <Eyebrow style={{ marginBottom: 6 }}>{label}</Eyebrow>
      <div style={{ font: `600 19px/1.1 ${MONO}`,
        color: tone === 'green' ? C.green : tone === 'amber' ? C.amber : C.text,
        letterSpacing: '-.01em', whiteSpace: 'nowrap',
        overflow: 'hidden', textOverflow: 'ellipsis' }}>{value}</div>
    </div>
  );
}

function Stepper({ label, value, onDown, onUp, sub }) {
  const btn = {
    width: 38, height: 38, flex: 'none', borderRadius: 11, cursor: 'pointer',
    background: 'rgba(255,255,255,.06)', border: `1px solid ${C.line}`,
    color: C.text, font: `500 18px/1 ${SANS}`,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  };
  return (
    <div>
      <Eyebrow style={{ marginBottom: 8 }}>{label}</Eyebrow>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={onDown} style={btn} aria-label={'Decrease ' + label}>−</button>
        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ font: `600 17px/1.1 ${MONO}`, color: C.text }}>{value}</div>
          {sub && <div style={{ font: `400 10px/1.4 ${MONO}`, color: C.dim, marginTop: 3 }}>{sub}</div>}
        </div>
        <button onClick={onUp} style={btn} aria-label={'Increase ' + label}>+</button>
      </div>
    </div>
  );
}

/* ── range slider (pointer-driven, works on touch) ───────────────────── */
function Range({ value, min = 0, max = 100, onChange, tone }) {
  const ref = useRef(null);
  const drag = useRef(false);
  const accent = tone === 'amber' ? C.amber : C.green;

  const set = (clientX) => {
    const r = ref.current.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    onChange(Math.round(min + pct * (max - min)));
  };
  const down = (e) => { drag.current = true; e.currentTarget.setPointerCapture(e.pointerId); set(e.clientX); };
  const move = (e) => { if (drag.current) set(e.clientX); };
  const up   = () => { drag.current = false; };

  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div ref={ref} onPointerDown={down} onPointerMove={move}
      onPointerUp={up} onPointerCancel={up}
      style={{ height: 42, display: 'flex', alignItems: 'center',
        cursor: 'pointer', touchAction: 'none' }}>
      <div style={{ position: 'relative', width: '100%', height: 6,
        borderRadius: 3, background: 'rgba(255,255,255,.09)' }}>
        <div style={{ position: 'absolute', inset: 0, width: pct + '%',
          borderRadius: 3, background: accent }} />
        <div style={{ position: 'absolute', top: '50%', left: pct + '%',
          width: 26, height: 26, marginLeft: -13, marginTop: -13,
          borderRadius: '50%', background: '#fff',
          boxShadow: '0 2px 10px rgba(0,0,0,.5)' }} />
      </div>
    </div>
  );
}

/* ── screen: map + search + list ─────────────────────────────────────── */
function MapScreen({ st, act }) {
  const { query, filters, sort, gps } = st;
  const list = act.visibleStations();

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column' }}>

      {/* map */}
      <div style={{ position: 'relative', flex: '0 0 46%', background: '#0F1316', overflow: 'hidden' }}>
        <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0 }}>
          <defs>
            <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
              <path d="M34 0H0V34" fill="none" stroke="rgba(255,255,255,.05)" strokeWidth="1" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)" />
          <path d="M-20 210 L200 150 L420 240" fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="16" />
          <path d="M120 -20 L170 400" fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="12" />
        </svg>

        <div style={{ position: 'absolute', left: 0, right: 0, top: '50%',
          transform: 'translateY(-50%)', textAlign: 'center',
          font: `400 9px/1.7 ${MONO}`, letterSpacing: '.16em', color: 'rgba(255,255,255,.14)' }}>
          MAP TILES<br />PLACEHOLDER
        </div>

        {list.map((s) => {
          const busy = s.free === 0;
          const bg = busy ? C.raised : s.dc ? C.amber : C.green;
          const fg = busy ? C.mid : C.ink;
          return (
            <button key={s.id} onClick={() => act.openStation(s.id)}
              style={{ position: 'absolute', left: s.x, top: s.y, cursor: 'pointer',
                transform: 'translate(-50%,-50%)', background: 'none',
                border: 'none', padding: 0, display: 'flex',
                flexDirection: 'column', alignItems: 'center', gap: 3 }}>
              <div style={{ minWidth: 50, height: 36, padding: '0 10px', borderRadius: 12,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                font: `600 13px/1 ${MONO}`, background: bg, color: fg,
                border: `2px solid ${C.bg}`, boxShadow: '0 6px 18px rgba(0,0,0,.55)' }}>
                {s.price}
              </div>
              <div style={{ font: `500 8.5px/1 ${MONO}`, letterSpacing: '.06em',
                padding: '2px 5px', borderRadius: 4,
                background: 'rgba(0,0,0,.7)', color: C.mid }}>{s.kw}kW</div>
            </button>
          );
        })}

        {/* search + filters float over the map */}
        <div style={{ position: 'absolute', top: 12, left: 14, right: 14 }}>
          <div style={{ height: 48, borderRadius: 15, background: C.surface,
            border: `1px solid ${C.line}`, boxShadow: '0 10px 30px rgba(0,0,0,.5)',
            display: 'flex', alignItems: 'center', padding: '0 14px', gap: 10 }}>
            <svg width="15" height="15" viewBox="0 0 16 16" style={{ flex: 'none' }}>
              <circle cx="7" cy="7" r="5" fill="none" stroke={C.dim} strokeWidth="1.6" />
              <path d="M11 11 L14.5 14.5" stroke={C.dim} strokeWidth="1.6" strokeLinecap="round" />
            </svg>
            <input
              value={query}
              onChange={(e) => act.setQuery(e.target.value)}
              placeholder="Search a charger, area or road"
              style={{ flex: 1, minWidth: 0, background: 'none', border: 'none',
                outline: 'none', color: C.text, font: `400 14.5px/1 ${SANS}`,
                WebkitUserSelect: 'text', userSelect: 'text' }} />
            {query
              ? <button onClick={() => act.setQuery('')} style={{ background: 'none',
                  border: 'none', color: C.dim, cursor: 'pointer',
                  font: `400 17px/1 ${SANS}`, padding: 0 }} aria-label="Clear search">×</button>
              : <span style={{ font: `500 9.5px/1 ${MONO}`, letterSpacing: '.1em', color: C.dim }}>BYD ATTO 3</span>}
          </div>

          <div style={{ display: 'flex', gap: 7, marginTop: 9, overflowX: 'auto',
            paddingBottom: 2, scrollbarWidth: 'none' }}>
            <Chip label="Rs 95 or less" on={filters.cheap} onClick={() => act.toggle('cheap')} />
            <Chip label="Available now" on={filters.avail} onClick={() => act.toggle('avail')} />
            <Chip label="DC fast" tone="amber" on={filters.dc} onClick={() => act.toggle('dc')} />
          </div>
        </div>
      </div>

      {/* list sheet */}
      <div style={{ flex: 1, minHeight: 0, background: C.surface,
        borderRadius: '22px 22px 0 0', marginTop: -20, position: 'relative',
        borderTop: `1px solid ${C.line}`, display: 'flex', flexDirection: 'column' }}>

        <div style={{ display: 'flex', justifyContent: 'center', padding: '9px 0 3px' }}>
          <div style={{ width: 38, height: 4, borderRadius: 2, background: C.line2 }} />
        </div>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '6px 18px 12px' }}>
          <div style={{ font: `600 15px/1.2 ${SANS}`, color: C.text }}>
            {list.length} {list.length === 1 ? 'station' : 'stations'}
            {gps.active && <span style={{ color: C.green }}> near you</span>}
          </div>
          <button onClick={act.cycleSort} style={{ background: 'none', border: 'none',
            cursor: 'pointer', font: `500 10px/1 ${MONO}`, letterSpacing: '.13em',
            color: C.mid, padding: 0 }}>
            SORT: {sort.toUpperCase()}
          </button>
        </div>

        <div style={{ flex: 1, minHeight: 0, overflowY: 'auto',
          padding: '0 14px 18px', WebkitOverflowScrolling: 'touch' }}>

          {/* GPS prompt / status */}
          {!gps.active && (
            <button onClick={act.locate} style={{ width: '100%', textAlign: 'left',
              marginBottom: 10, padding: '13px 15px', borderRadius: 14, cursor: 'pointer',
              background: C.greenDim, border: `1px solid rgba(0,214,143,.3)`,
              display: 'flex', alignItems: 'center', gap: 11 }}>
              <div style={{ width: 9, height: 9, borderRadius: '50%', background: C.green, flex: 'none' }} />
              <div style={{ flex: 1 }}>
                <div style={{ font: `600 13px/1.3 ${SANS}`, color: C.text }}>
                  {gps.status === 'locating' ? 'Finding you…' : 'Use my location'}
                </div>
                <div style={{ font: `400 11px/1.4 ${SANS}`, color: C.mid, marginTop: 2 }}>
                  {gps.error || 'Sorts by real distance from where you are'}
                </div>
              </div>
            </button>
          )}
          {gps.active && (
            <div style={{ marginBottom: 10, padding: '9px 14px', borderRadius: 12,
              background: 'rgba(255,255,255,.04)', border: `1px solid ${C.line}`,
              font: `400 10.5px/1.45 ${MONO}`, color: C.dim, letterSpacing: '.02em' }}>
              LIVE GPS · STRAIGHT-LINE DISTANCE, NOT ROAD
            </div>
          )}

          {list.length === 0 && (
            <div style={{ padding: '34px 8px', textAlign: 'center' }}>
              <div style={{ font: `600 14px/1.4 ${SANS}`, color: C.text, marginBottom: 5 }}>
                No stations match
              </div>
              <div style={{ font: `400 13px/1.5 ${SANS}`, color: C.mid, marginBottom: 15 }}>

              <button key={s.id} onClick={() => act.openStation(s.id)}
                style={{ width: '100%', textAlign: 'left', marginBottom: 8,
                  padding: '14px 15px', borderRadius: 15, cursor: 'pointer',
                  background: C.raised, border: `1px solid ${cheapest ? 'rgba(0,214,143,.35)' : C.line}`,
                  display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 5 }}>
                    <div style={{ width: 6, height: 6, borderRadius: '50%', flex: 'none',
                      background: s.free === 0 ? C.dim : s.dc ? C.amber : C.green }} />
                    <div style={{ font: `500 9.5px/1 ${MONO}`, letterSpacing: '.1em',
                      color: s.free === 0 ? C.dim : s.dc ? C.amber : C.green }}>
                      {s.free === 0 ? 'ALL BUSY' : s.free + ' FREE' + (s.dc ? ' · DC' : '')}
                    </div>

                  <div style={{ font: `600 14.5px/1.25 ${SANS}`, color: C.text,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</div>
                  <div style={{ font: `400 11.5px/1.4 ${SANS}`, color: C.mid, marginTop: 3,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {s.distLabel} · {s.kw} kW · {s.area}
                  </div>
                </div>
                <div style={{ textAlign: 'right', flex: 'none' }}>
                  <div style={{ font: `600 17px/1 ${MONO}`, color: cheapest ? C.green : C.text }}>
                    Rs {s.price}
                  </div>
                  <div style={{ font: `400 8.5px/1 ${MONO}`, letterSpacing: '.1em',
                    color: C.dim, margin: '4px 0 5px' }}>PER KWH</div>
                  <div style={{ font: `500 11px/1 ${MONO}`, color: C.mid }}>{s.fillCost}</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ── screen: station detail ──────────────────────────────────────────── */
function StationScreen({ st, act }) {
  const s = act.selected();
  const fill = act.fillFor(s);
  const cheaper = STATIONS.filter(x => x.price < s.price).sort((a,b) => a.price - b.price)[0];
  const perKmEv = s.price / EFF;
  const perKmPetrol = st.petrol / st.kmpl;

  const guns = [];
  for (let i = 0; i < Math.min(s.guns, 3); i++) {
    const busy = i >= s.free;
    const live = busy && i === s.free;
    guns.push({ i, busy, live });
  }

  return (
    <div style={{ position: 'absolute', inset: 0, overflowY: 'auto',
      WebkitOverflowScrolling: 'touch', background: C.bg }}>

      <div style={{ padding: '10px 16px 0' }}>
        <button onClick={act.backToMap} style={{ background: 'rgba(255,255,255,.06)',
          border: `1px solid ${C.line}`, borderRadius: 11, cursor: 'pointer',
          color: C.text, font: `500 12.5px/1 ${SANS}`, padding: '9px 14px',
          display: 'flex', alignItems: 'center', gap: 7 }}>
          <span style={{ font: `400 15px/1 ${SANS}` }}>←</span> Back
        </button>
      </div>

      {/* header */}
      <div style={{ padding: '16px 18px 20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 9 }}>
          <div style={{ width: 7, height: 7, borderRadius: '50%',
            background: s.free === 0 ? C.dim : s.dc ? C.amber : C.green,
            animation: s.free === 0 ? 'none' : 'cvpulse 1.8s ease-in-out infinite' }} />
          <div style={{ font: `500 9.5px/1 ${MONO}`, letterSpacing: '.12em',
            color: s.free === 0 ? C.dim : s.dc ? C.amber : C.green }}>
            {s.free === 0 ? 'ALL BUSY' : s.free + ' FREE NOW' + (s.dc ? ' · DC FAST' : '')}
          </div>
        </div>
        <h1 style={{ font: `600 25px/1.16 ${SANS}`, letterSpacing: '-.02em',
          color: C.text, margin: '0 0 8px' }}>{s.name}</h1>
        <div style={{ font: `400 13px/1.5 ${SANS}`, color: C.mid }}>
          {s.area} · {s.distLabel} · {s.kw} kW max
        </div>
      </div>

      {/* the money row */}
      <div style={{ margin: '0 14px 12px', padding: '17px 18px', borderRadius: 18,
        background: C.surface, border: `1px solid ${C.line}`,
        display: 'flex', gap: 14 }}>
        <Stat label="Per kWh" value={'Rs ' + s.price} tone="green" />
        <div style={{ width: 1, background: C.line }} />
        <Stat label="60% fill" value={fill.cost} />
        <div style={{ width: 1, background: C.line }} />
        <Stat label="Takes" value={fill.time} />
      </div>

      {/* vs petrol */}
      <div style={{ margin: '0 14px 12px', padding: '17px 18px', borderRadius: 18,
        background: C.surface, border: `1px solid ${C.line}` }}>
        <Eyebrow style={{ marginBottom: 13 }}>Cost per km here</Eyebrow>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 9 }}>
          <div style={{ font: `600 30px/1 ${MONO}`, color: C.green, letterSpacing: '-.02em' }}>
            {rs(perKmEv)}
          </div>
          <div style={{ font: `400 13px/1 ${SANS}`, color: C.mid }}>
            vs {rs(perKmPetrol)} on petrol
          </div>
        </div>
        <div style={{ height: 8, borderRadius: 4, background: 'rgba(255,255,255,.07)',
          overflow: 'hidden', marginBottom: 10 }}>
          <div style={{ height: '100%', borderRadius: 4, background: C.green,
            width: Math.min(100, (perKmEv / perKmPetrol) * 100) + '%' }} />
        </div>
        <div style={{ font: `400 12.5px/1.5 ${SANS}`, color: C.mid }}>
          {perKmEv < perKmPetrol
            ? <>Charging here costs <strong style={{ color: C.text, fontWeight: 600 }}>
                {Math.round((1 - perKmEv / perKmPetrol) * 100)}% less per km</strong> than petrol
                at {money(st.petrol)}/L.</>
            : <>This station is more expensive per km than petrol at {money(st.petrol)}/L.</>}
        </div>
      </div>

      {/* guns */}
      <div style={{ margin: '0 14px 12px', padding: '17px 18px', borderRadius: 18,
        background: C.surface, border: `1px solid ${C.line}` }}>
        <Eyebrow style={{ marginBottom: 13 }}>Connectors</Eyebrow>
        {guns.map(({ i, busy, live }) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12,
            padding: '11px 0', borderBottom: i < guns.length - 1 ? `1px solid ${C.line}` : 'none' }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', flex: 'none',
              background: live ? C.amber : busy ? C.dim : C.green,
              animation: live ? 'cvpulse 1.6s ease-in-out infinite' : 'none' }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: `500 13.5px/1.3 ${SANS}`, color: C.text }}>
                Gun {i + 1} · {s.dc ? 'CCS2' : 'Type 2'}
              </div>
              <div style={{ font: `400 11.5px/1.4 ${SANS}`, color: C.mid, marginTop: 2 }}>
                {live ? `Charging — ${st.liveSoc}% · ${Math.round(s.kw * 0.72)} kW · ~${Math.max(2, Math.round((92 - st.liveSoc) * 0.6))} min left`
                      : busy ? 'Occupied — no session data'
                      : `${s.kw} kW max · ready now`}
              </div>
            </div>
            <div style={{ font: `500 9.5px/1 ${MONO}`, letterSpacing: '.1em', flex: 'none',
              color: live ? C.amber : busy ? C.dim : C.green }}>
              {live ? 'CHARGING' : busy ? 'BUSY' : 'FREE'}
            </div>
          </div>
        ))}
      </div>

      {/* cheaper nearby */}
      {cheaper && (
        <button onClick={() => act.openStation(cheaper.id)}
          style={{ width: 'calc(100% - 28px)', margin: '0 14px 12px', textAlign: 'left',
            padding: '15px 18px', borderRadius: 18, cursor: 'pointer',
            background: C.greenDim, border: '1px solid rgba(0,214,143,.3)' }}>
          <Eyebrow style={{ marginBottom: 7, color: C.green }}>Cheaper nearby</Eyebrow>
          <div style={{ font: `600 15px/1.3 ${SANS}`, color: C.text, marginBottom: 4 }}>
            {money((s.price - cheaper.price) * CAP * 0.6)} less for the same fill
          </div>
          <div style={{ font: `400 12px/1.4 ${SANS}`, color: C.mid }}>
            {cheaper.name} · Rs {cheaper.price}/kWh · {cheaper.kw} kW
          </div>
        </button>
      )}

      <div style={{ padding: '0 14px 24px' }}>
        <button onClick={() => act.goCalc(s.price)} style={{ width: '100%', padding: '15px',
          borderRadius: 15, cursor: 'pointer', background: C.green, color: C.ink,
          border: 'none', font: `600 14px/1 ${SANS}` }}>
          Work out my charge cost
        </button>
      </div>
    </div>
  );
}

/* ── screen: trip planner ────────────────────────────────────────────── */
function PlanScreen({ st, act }) {
  const trip = act.trip();

  const pickerRow = (label, value, onPick) => (
    <div style={{ marginBottom: 12 }}>
      <Eyebrow style={{ marginBottom: 8 }}>{label}</Eyebrow>
      <div style={{ display: 'flex', gap: 7, overflowX: 'auto', paddingBottom: 3,
        scrollbarWidth: 'none' }}>
        {STATIONS.map(s => (
          <button key={s.id} onClick={() => onPick(s.id)}
            style={{ flex: 'none', padding: '9px 12px', borderRadius: 11, cursor: 'pointer',
              background: value === s.id ? C.text : 'rgba(255,255,255,.05)',
              color: value === s.id ? C.bg : C.text,
              border: `1px solid ${value === s.id ? C.text : C.line}`,
              font: `500 11.5px/1 ${SANS}`, whiteSpace: 'nowrap' }}>
            {s.name.split(' · ')[0]}
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ position: 'absolute', inset: 0, overflowY: 'auto',
      WebkitOverflowScrolling: 'touch', background: C.bg, padding: '18px 14px 24px' }}>

      <h1 style={{ font: `600 23px/1.2 ${SANS}`, letterSpacing: '-.02em',
        color: C.text, margin: '0 0 6px' }}>Plan a trip</h1>
      <p style={{ font: `400 13px/1.5 ${SANS}`, color: C.mid, margin: '0 0 20px' }}>
        Pick your ends, set the distance, and see what each way of doing it costs.
      </p>

      <div style={{ padding: '17px 18px', borderRadius: 18, background: C.surface,
        border: `1px solid ${C.line}`, marginBottom: 12 }}>
        {pickerRow('Start', st.tripFrom, act.setTripFrom)}
        {pickerRow('Destination', st.tripTo, act.setTripTo)}

        <div style={{ display: 'flex', gap: 14, marginTop: 4 }}>
          <div style={{ flex: 1 }}>
            <Stepper label="Distance" value={st.tripKm + ' km'}
              onDown={() => act.setTripKm(st.tripKm - 25)}
              onUp={() => act.setTripKm(st.tripKm + 25)}
              sub={trip.autoKm ? 'straight-line estimate' : 'set by you'} />
          </div>
        </div>
      </div>

      {/* route strategy */}
      <div style={{ display: 'flex', gap: 7, marginBottom: 12 }}>
        {[['cheapest','Cheapest'], ['fastest','Fastest'], ['fewest','Fewest stops']].map(([k, label]) => {
          const on = st.route === k;
          const r = trip.options[k];
          return (
            <button key={k} onClick={() => act.setRoute(k)}
              style={{ flex: 1, padding: '12px 8px', borderRadius: 14, cursor: 'pointer',
                background: on ? C.text : C.surface, color: on ? C.bg : C.text,
                border: `1px solid ${on ? C.text : C.line}`, textAlign: 'center' }}>
              <div style={{ font: `600 11.5px/1.2 ${SANS}`, marginBottom: 5 }}>{label}</div>
              <div style={{ font: `600 13px/1 ${MONO}` }}>{money(r.cost)}</div>
              <div style={{ font: `400 9.5px/1 ${MONO}`, marginTop: 4,
                color: on ? 'rgba(11,13,15,.6)' : C.dim }}>{r.time}</div>
            </button>
          );
        })}
      </div>

      {/* result */}
      <div style={{ padding: '17px 18px', borderRadius: 18, background: C.surface,
        border: `1px solid ${C.line}`, marginBottom: 12 }}>
        <div style={{ display: 'flex', gap: 14, marginBottom: 16 }}>
          <Stat label="Trip cost" value={money(trip.cost)} tone="green" />
          <div style={{ width: 1, background: C.line }} />
          <Stat label="Drive time" value={trip.time} />
          <div style={{ width: 1, background: C.line }} />
          <Stat label="Arrive at" value={trip.arrive + '%'} />
        </div>

        {trip.noStops && (
          <div style={{ paddingTop: 13, borderTop: `1px solid ${C.line}`, marginTop: 13,
            font: `400 12.5px/1.5 ${SANS}`, color: C.mid }}>
            No charging stop needed — {st.tripKm} km is inside one full battery.
            The cost above is the energy you'll use getting there.
          </div>
        )}

        {trip.stops.map((s, i) => (
          <div key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start',
            paddingTop: 13, borderTop: `1px solid ${C.line}`, marginTop: 13 }}>
            <div style={{ width: 24, height: 24, borderRadius: 8, flex: 'none',
              background: 'rgba(255,255,255,.07)', color: C.text,
              font: `600 11px/24px ${MONO}`, textAlign: 'center' }}>{i + 1}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: `500 13.5px/1.3 ${SANS}`, color: C.text }}>{s.name}</div>
              <div style={{ font: `400 11.5px/1.4 ${SANS}`, color: C.mid, marginTop: 2 }}>{s.sub}</div>
            </div>
            <div style={{ textAlign: 'right', flex: 'none' }}>
              <div style={{ font: `600 12.5px/1 ${MONO}`, color: C.text }}>{money(s.cost)}</div>
              <div style={{ font: `400 10px/1 ${MONO}`, color: C.dim, marginTop: 4 }}>{s.mins} min</div>
            </div>
          </div>
        ))}
      </div>

      {/* vs petrol */}
      <div style={{ padding: '17px 18px', borderRadius: 18, background: C.greenDim,
        border: '1px solid rgba(0,214,143,.28)' }}>
        <Eyebrow style={{ marginBottom: 10, color: C.green }}>Against petrol</Eyebrow>
        <div style={{ font: `600 26px/1.1 ${MONO}`, color: C.green,
          letterSpacing: '-.02em', marginBottom: 8 }}>
          {money(Math.max(0, trip.petrol - trip.cost))} saved
        </div>
        <div style={{ font: `400 12.5px/1.55 ${SANS}`, color: C.mid }}>
          The same {st.tripKm} km in a petrol car doing {st.kmpl} km/L costs about {money(trip.petrol)} at {money(st.petrol)}/L
          — {rs(trip.perKmPetrol)}/km against {rs(trip.perKmEv)}/km charging.
        </div>
      </div>
    </div>
  );
}

/* ── screen: cost calculator ─────────────────────────────────────────── */

      WebkitOverflowScrolling: 'touch', background: C.bg, padding: '18px 14px 24px' }}>

      {/* headline */}
      <div style={{ padding: '20px 18px', borderRadius: 18, background: C.surface,

        <Eyebrow style={{ marginBottom: 10 }}>This charge</Eyebrow>
        <div style={{ font: `600 40px/1 ${MONO}`, color: C.green,

        <div style={{ display: 'flex', gap: 14 }}>

          alignItems: 'baseline', marginBottom: 2 }}>

                style={{ flex: 1, padding: '11px 4px', borderRadius: 12, cursor: 'pointer',

                  color: on ? C.bg : C.text,
                  border: `1px solid ${on ? C.text : C.line}`, textAlign: 'center' }}>
                <div style={{ font: `600 13px/1 ${MONO}` }}>{kw}</div>
                <div style={{ font: `500 8px/1 ${MONO}`, letterSpacing: '.1em', marginTop: 5,

              </button>
            );
          })}

      {/* prices you control */}
      <div style={{ padding: '17px 18px', borderRadius: 18, background: C.surface,
        border: `1px solid ${C.line}`, marginBottom: 12 }}>
        <div style={{ display: 'flex', gap: 18, marginBottom: 16 }}>
          <div style={{ flex: 1 }}>
            <Stepper label="Charging" value={'Rs ' + st.price}
              sub="per kWh"
              onDown={() => act.setPrice(st.price - 5)}
              onUp={() => act.setPrice(st.price + 5)} />
          </div>

        <div style={{ display: 'flex', gap: 18 }}>
          <div style={{ flex: 1 }}>

              onUp={() => act.setPetrol(st.petrol + 5)} />

      {/* the comparison */}

        border: '1px solid rgba(0,214,143,.28)' }}>
        <Eyebrow style={{ marginBottom: 12, color: C.green }}>Per kilometre</Eyebrow>

        <div style={{ marginBottom: 13 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between',
            alignItems: 'baseline', marginBottom: 6 }}>
            <div style={{ font: `500 12px/1 ${SANS}`, color: C.text }}>Electric</div>
            <div style={{ font: `600 15px/1 ${MONO}`, color: C.green }}>{c.perKmEv}</div>
          </div>
          <div style={{ height: 9, borderRadius: 5, background: 'rgba(255,255,255,.08)', overflow: 'hidden' }}>
            <div style={{ height: '100%', borderRadius: 5, background: C.green, width: c.evBarPct }} />
          </div>
        </div>

        <div style={{ marginBottom: 15 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between',
            alignItems: 'baseline', marginBottom: 6 }}>
            <div style={{ font: `500 12px/1 ${SANS}`, color: C.text }}>Petrol</div>
            <div style={{ font: `600 15px/1 ${MONO}`, color: C.mid }}>{c.perKmPetrol}</div>
          </div>
          <div style={{ height: 9, borderRadius: 5, background: 'rgba(255,255,255,.08)', overflow: 'hidden' }}>
            <div style={{ height: '100%', borderRadius: 5, background: 'rgba(255,255,255,.28)', width: '100%' }} />
          </div>
        </div>

        <div style={{ font: `400 12.5px/1.55 ${SANS}`, color: C.mid, paddingTop: 14,
          borderTop: '1px solid rgba(0,214,143,.2)' }}>
          {c.cheaperBy > 0
            ? <>Electric is <strong style={{ color: C.text, fontWeight: 600 }}>{c.cheaperBy}% cheaper per km</strong>.
                Over 1,200 km a month that's about <strong style={{ color: C.green, fontWeight: 600 }}>{c.monthly} saved</strong>.</>
            : <>At these prices petrol is currently the cheaper option per km.</>}
        </div>
      </div>
    </div>
  );
}

/* ── root ────────────────────────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState('map');
  const [station, setStation] = useState(null);
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('price');
  const [filters, setFilters] = useState({ cheap: false, avail: false, dc: false });
  const [gps, setGps] = useState({ active: false, lat: null, lon: null, status: 'idle', error: '' });

  const [from, setFrom] = useState(24);
  const [to, setTo] = useState(80);
  const [speed, setSpeed] = useState(11);
  const [price, setPrice] = useState(95);
  const [petrol, setPetrol] = useState(() => store.get('petrol', PETROL_DEFAULT));
  const [kmpl, setKmpl] = useState(() => store.get('kmpl', KMPL_DEFAULT));

  const [tripFrom, setTripFrom] = useState('meridian');
  const [tripTo, setTripTo] = useState('northgate');
  const [tripKmManual, setTripKmManual] = useState(null);
  const [route, setRoute] = useState('cheapest');

  const [liveSoc, setLiveSoc] = useState(62);
  useEffect(() => {
    const t = setInterval(() => setLiveSoc(v => (v >= 97 ? 41 : v + 1)), 2200);
    return () => clearInterval(t);
  }, []);

  useEffect(() => { store.set('petrol', petrol); }, [petrol]);
  useEffect(() => { store.set('kmpl', kmpl); }, [kmpl]);

  // Auto trip distance from the two endpoints, unless overridden.
  const autoKm = useMemo(() => {
    const a = STATIONS.find(s => s.id === tripFrom), b = STATIONS.find(s => s.id === tripTo);
    if (!a || !b) return 375;
    return Math.max(25, Math.round(haversine(a.lat, a.lon, b.lat, b.lon)));
  }, [tripFrom, tripTo]);
  const tripKm = tripKmManual == null ? autoKm : tripKmManual;

  // Stations with live distance + derived labels.
  const withDist = useMemo(() => STATIONS.map(s => {
    const d = gps.active ? haversine(gps.lat, gps.lon, s.lat, s.lon) : s.dist;
    return { ...s, liveDist: d, distLabel: d.toFixed(d < 10 ? 1 : 0) + ' km',
      fillCost: money(CAP * 0.6 * s.price) };
  }), [gps]);

  const st = { tab, station, query, sort, filters, gps, from, to, speed, price,
    petrol, kmpl, tripFrom, tripTo, tripKm, route, liveSoc };

  const act = {
    visibleStations() {
      const q = query.trim().toLowerCase();
      let r = withDist.filter(s =>
        (!filters.avail || s.free > 0) &&
        (!filters.dc || s.dc) &&
        (!filters.cheap || s.price <= 95) &&
        (!q || s.name.toLowerCase().includes(q) || s.area.toLowerCase().includes(q)));
      return r.sort((a, b) => sort === 'price' ? a.price - b.price
        : sort === 'distance' ? a.liveDist - b.liveDist : b.kw - a.kw);
    },
    selected() {
      return withDist.find(s => s.id === station) || withDist[2];
    },
    fillFor(s) {
      const kwh = CAP * 0.6;
      return { cost: money(kwh * s.price), time: mins(kwh / Math.min(s.kw, 46)) };
    },
    setQuery,
    toggle: (k) => setFilters(f => ({ ...f, [k]: !f[k] })),
    clearAll: () => { setQuery(''); setFilters({ cheap: false, avail: false, dc: false }); },
    cycleSort: () => setSort(s => s === 'price' ? 'distance' : s === 'distance' ? 'power' : 'price'),
    openStation: (id) => { setStation(id); setTab('station'); },
    backToMap: () => { setStation(null); setTab('map'); },
    goCalc: (p) => { setPrice(p); setTab('calc'); },

    locate() {
      if (!navigator.geolocation) {
        setGps(g => ({ ...g, status: 'error', error: 'This browser has no location support' }));
        return;
      }
      setGps(g => ({ ...g, status: 'locating', error: '' }));
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setGps({ active: true, lat: pos.coords.latitude, lon: pos.coords.longitude,
            status: 'ok', error: '' });
          setSort('distance');
        },
        (err) => {
          const msg = err.code === 1
            ? 'Location permission denied — using saved distances'
            : location.protocol === 'file:'
              ? 'Location needs the app served over https'
              : 'Could not get a fix — using saved distances';
          setGps({ active: false, lat: null, lon: null, status: 'error', error: msg });
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    },

    setFrom: (v) => setFrom(Math.min(v, to - 5)),
    setTo:   (v) => setTo(Math.max(v, from + 5)),
    setSpeed,
    setPrice:  (v) => setPrice(Math.max(20, Math.min(250, v))),
    setPetrol: (v) => setPetrol(Math.max(50, Math.min(600, Math.round(v * 100) / 100))),
    setKmpl:   (v) => setKmpl(Math.max(5, Math.min(40, v))),
    resetPetrol: () => setPetrol(PETROL_DEFAULT),

    setTripFrom: (id) => { setTripFrom(id); setTripKmManual(null); },
    setTripTo:   (id) => { setTripTo(id); setTripKmManual(null); },
    setTripKm:   (v) => setTripKmManual(Math.max(25, Math.min(2000, v))),
    setRoute,

    calc() {
      const kwh = Math.max(0, CAP * (to - from) / 100);
      const km = Math.round(kwh * EFF), cost = kwh * price;
      const litres = km / kmpl, petrolCost = litres * petrol;
      const perKmEv = price / EFF, perKmPetrol = petrol / kmpl;
      return {
        kwh: kwh.toFixed(1), cost: money(cost), km, time: mins(kwh / speed),
        petrol: money(petrolCost), litres: litres.toFixed(1),
        perKmEv: rs(perKmEv), perKmPetrol: rs(perKmPetrol),
        evBarPct: Math.min(100, Math.round(perKmEv / perKmPetrol * 100)) + '%',
        cheaperBy: Math.round((1 - perKmEv / perKmPetrol) * 100),
        monthly: money(Math.max(0, (perKmPetrol - perKmEv) * 1200)),
      };
    },

    trip() {
      // You pay for every kWh the trip consumes, wherever you end up putting it
      // back — so cost tracks distance, not just the top-ups en route.
      const kwhNeeded = tripKm / EFF;
      // Each strategy uses a different slice of the battery: cheap AC stops top
      // up less per stop, so you make more of them; the fewest-stops plan
      // charges nearer to full each time.
      const opts = {
        cheapest: { rate: 56,  stopKw: 15,  label: 'AC',   kmh: 62, win: 0.60 },
        fastest:  { rate: 135, stopKw: 150, label: 'DC',   kmh: 74, win: 0.72 },
        fewest:   { rate: 95,  stopKw: 60,  label: 'CCS2', kmh: 68, win: 0.86 },
      };
      const built = {};
      for (const k of Object.keys(opts)) {
        const o = opts[k];
        const usable = CAP * o.win;
        // Stops needed to cover whatever the first battery can't.
        const n = Math.max(0, Math.ceil((kwhNeeded - usable) / usable));
        const enRoute = Math.max(0, kwhNeeded - usable);   // kWh bought mid-trip
        const chargeMins = n === 0 ? 0 : Math.round((enRoute / o.stopKw) * 60);
        const cost = kwhNeeded * o.rate;                   // all energy used
        const arrivePct = Math.max(8, Math.round(
          ((usable * (n + 1) - kwhNeeded) / CAP) * 100));
        built[k] = { cost, time: mins(tripKm / o.kmh + chargeMins / 60),
          arrive: Math.min(95, arrivePct), n, rate: o.rate,
          chargeMins, label: o.label, enRoute };
      }
      const r = built[route];
      const stops = [];
      for (let i = 0; i < r.n; i++) {
        const s = STATIONS.reduce((best, x) =>
          Math.abs(x.price - r.rate) < Math.abs(best.price - r.rate) ? x : best, STATIONS[0]);
        stops.push({
          name: s.name,
          sub: `km ${Math.round(tripKm * (i + 1) / (r.n + 1))} · ${s.kw} kW · Rs ${s.price}/kWh`,
          cost: (r.enRoute / r.n) * r.rate,
          mins: Math.round(r.chargeMins / r.n),
        });
      }
      const petrolCost = (tripKm / kmpl) * petrol;
      return { options: built, cost: r.cost, time: r.time, arrive: r.arrive, stops,
        petrol: petrolCost, autoKm: tripKmManual == null, noStops: r.n === 0,
        perKmEv: r.cost / tripKm, perKmPetrol: petrolCost / tripKm };
    },
  };

  const TABS = [['map','Find'], ['plan','Trip'], ['calc','Costs']];
  const activeTab = tab === 'station' ? 'map' : tab;

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex',
      flexDirection: 'column', background: C.bg }}>
      <div style={{ flex: 1, position: 'relative', minHeight: 0 }}>
        {tab === 'map'     && <MapScreen st={st} act={act} />}
        {tab === 'station' && <StationScreen st={st} act={act} />}
        {tab === 'plan'    && <PlanScreen st={st} act={act} />}
        {tab === 'calc'    && <CalcScreen st={st} act={act} />}
      </div>

      <nav style={{ flex: 'none', display: 'flex', background: C.surface,
        borderTop: `1px solid ${C.line}`, padding: '9px 8px 4px' }}>
        {TABS.map(([id, label]) => {
          const on = activeTab === id;
          return (
            <button key={id} onClick={() => { setTab(id); setStation(null); }}
              style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer',
                padding: '6px 0 8px', display: 'flex', flexDirection: 'column',
                alignItems: 'center', gap: 6 }}>
              <div style={{ width: 20, height: 3, borderRadius: 2,
                background: on ? C.green : 'transparent' }} />
              <div style={{ font: `${on ? 600 : 500} 11.5px/1 ${SANS}`,
                color: on ? C.text : C.dim }}>{label}</div>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

window.CarevApp = App;

</script>

<script>
(function wait(t){
 t=t||0;
 if(window.CarevApp){
  var b=document.getElementById('boot');
  try{
   ReactDOM.createRoot(document.getElementById('root'))
    .render(React.createElement(window.CarevApp));
   if(b) setTimeout(function(){b.remove();},130);
  }catch(err){
   if(b) b.remove();
   document.getElementById('root').innerHTML=
    '<pre style="padding:22px;font:12px/1.6 monospace;color:#ff6b6b;white-space:pre-wrap">'
    +'Render failed:\n'+(err&&err.stack||err)+'</pre>';
  }
  return;
 }
 if(t>240){
  var b2=document.getElementById('boot'); if(b2) b2.remove();
  document.getElementById('root').innerHTML=
   '<pre style="padding:22px;font:12px/1.6 monospace;color:#ff6b6b">'
   +'Scripts failed to load.\nReact and Babel come from a CDN — check your connection.</pre>';
  return;
 }
 setTimeout(function(){wait(t+1);},25);
})();
</script>
</body></html>
